[plugin]
id = "neko_danmaku"
name = "弹幕猫娘"
description = "把宿主聊天搬到游戏/窗口：主人说话与 YUI 回应以弹幕飘过目标画面（OBS 式选窗口/显示器），鼠标穿透、样式可配、随聊天时间自然滚动。"
short_description = "Host chat as on-screen danmaku overlay."
keywords = ["弹幕", "danmaku", "浮层", "overlay", "聊天", "游戏", "聊天框", "悬浮", "直播", "barrage"]
version = "0.2.1"
entry = "plugin.plugins.neko_danmaku:NekoDanmakuPlugin"

[plugin.author]
name = "N.E.K.O Team"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin_runtime]
enabled = true
auto_start = true

[plugin.store]
enabled = false

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "main"
title = "弹幕猫娘"
entry = "static/index.html"
context = "dashboard"
permissions = ["state:read", "action:call"]

[[plugin.ui.guide]]
id = "guide"
title = "使用指南"
entry = "docs/ui/guide.md"
mode = "markdown"
permissions = ["state:read"]
